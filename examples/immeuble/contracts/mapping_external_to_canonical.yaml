workspace_id: immeuble
ontology_id: immeuble::core
source_tag: structured_import
data_plane: import_ready

import_ready:
  facets_csv: import_ready/mfo_facets_import.csv
  edges_csv: import_ready/graph_edges_import.csv

entities:
  building:
    csv: fake_data/building.csv
    schema_id: immeuble:core:building
    record_id_column: record_id
    content_columns:
      - name
  unit:
    csv: fake_data/unit.csv
    schema_id: immeuble:core:unit
    record_id_column: record_id
    content_columns:
      - numero_lot
  person:
    csv: fake_data/person.csv
    schema_id: immeuble:core:person
    record_id_column: record_id
    content_columns:
      - nom
      - prenom
  lease_contract:
    csv: fake_data/lease_contract.csv
    schema_id: immeuble:core:lease_contract
    record_id_column: record_id
    content_columns:
      - reference
  household:
    csv: fake_data/household.csv
    schema_id: immeuble:core:household
    record_id_column: record_id
    content_columns:
      - household_name
    notes: >
      Optional legacy relation carrier for actor-facing prompts.

contract_relations:
  - source_type: building
    target_type: unit
    edge_label: CONTAINS
    source_ref_column: building_id
    target_ref_column: unit_id

edges_mode: import_ready
notes: >
  Canonical import contract for the immeuble workspace.
  Generated by build-immeuble-model.mjs in practice; this file remains a compact compatibility view.
