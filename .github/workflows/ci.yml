name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  write-integrity:
    uses: ./.github/workflows/write-integrity.yml

  node:
    name: Node runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify npm pack
        run: npm run verify:pack

      - name: Test
        run: npm run test

  docker-native:
    name: Docker native
    runs-on: ubuntu-latest
    needs: node
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run sequential E2E verification
        run: |
          GHOSTCRAB_POSTGRES_STACK=native PG_PORT=5432 DATABASE_URL=postgres://ghostcrab:ghostcrab@localhost:5432/ghostcrab npm run verify:e2e

  immeuble-live:
    name: Immeuble live backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install dependencies
        run: npm ci

      - name: Build ghostcrab-backend
        run: BACKEND_VENDOR_UPDATE=0 npm run backend:build

      - name: Build MCP and verify native write integrity
        run: |
          npm run build
          npm run test:integrity:native

      - name: Immeuble hybrid CI gate
        run: npm run immeuble:import:hybrid

      - name: Verify native plan selection, Unicode search and collection facets
        run: |
          cmd/backend/zig-out/bin/ghostcrab-backend \
            --addr 127.0.0.1:18095 --db "$RUNNER_TEMP/search-regression.sqlite" > "$RUNNER_TEMP/search-backend.log" 2>&1 &
          search_backend_pid=$!
          trap 'kill "$search_backend_pid"; wait "$search_backend_pid" || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18095/health; then break; fi
            sleep 1
          done
          GHOSTCRAB_SEARCH_TEST_MINDBRAIN_URL=http://127.0.0.1:18095 \
            MINDBRAIN_TEST_BINARY="$PWD/cmd/backend/zig-out/bin/ghostcrab-backend" \
            npm test -- tests/tools/search-handoff-native.test.ts tests/unit/collection-facets-native.test.ts

      - name: Run Immeuble live-lab (backend + live verify)
        run: |
          bash examples/immeuble/scripts/run-immeuble-live-lab.sh \
            --db "$RUNNER_TEMP/immeuble.sqlite" \
            --engine both \
            --with-artifact-seed \
            --with-live-verify \
            --stop-after live_verify
