name: Publish

# GitHub Actions — stage releases on tags when this repository is hosted on GitHub.
# npm OIDC / provenance assume GitHub; for other hosts (e.g. GitLab-only), replicate
# the same steps with a masked NPM_TOKEN.
#
# Security rule: no direct `npm publish`. This workflow only SUBMITS the packages to
# npm's staging area (`npm stage publish`, requires npm >= 11.15.0 / Node >= 22.14.0).
# Nothing goes live until a maintainer approves each staged package with 2FA
# (`npm stage approve <stage-id>` or the Staged Packages tab on npmjs.com) —
# approve the six platform packages BEFORE the root package.
#
# Intended pipeline (to align with docs/dev/npm_split_release_process.md):
#   1. Cross-compile Zig backends → prebuilds/{platform}/ (Zig 0.16.x per scripts/cross-build-all.sh).
#   2. npm ci && npm run build
#   3. Stage the six @mindflight/ghostcrab-personal-mcp-* platform packages, then the root package (scripts/publish-npm-split.mjs).
#   4. Maintainer reviews + approves the 7 staged packages with 2FA (platform packages first, root last).

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read
  id-token: write # required for npm trusted publishing (OIDC)

env:
  ZIG_VERSION: "0.16.0"
  SQLITE_VERSION: "3490100"
  SQLITE_YEAR: "2025"
  NODE_VERSION: "20"

jobs:
  # ── Job 1: cross-compile the Zig backend for all platforms ─────────────────
  build-backends:
    name: Cross-compile backends
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Zig ${{ env.ZIG_VERSION }}
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Vendor mindbrain
        run: scripts/ensure-vendor.sh
        env:
          MINDBRAIN_REPO_URL: https://gitlab.com/webigniter/mindbrain.git

      - name: Download sqlite3 amalgamation
        run: scripts/download-sqlite3.sh
        env:
          SQLITE_VERSION: ${{ env.SQLITE_VERSION }}
          SQLITE_YEAR: ${{ env.SQLITE_YEAR }}

      - name: Cross-compile all platforms
        run: scripts/cross-build-all.sh
        env:
          ZIG_OPTIMIZE: ReleaseFast

      - name: List prebuilds
        run: find prebuilds -type f | sort

      - name: Verify win32-x64 prebuilds
        run: |
          test -f prebuilds/win32-x64/ghostcrab-backend.exe
          test -f prebuilds/win32-x64/ghostcrab-document.exe
          file prebuilds/win32-x64/ghostcrab-backend.exe | grep -Ei 'PE32|PE32\+'

      - name: Verify win32-arm64 prebuilds
        run: |
          test -f prebuilds/win32-arm64/ghostcrab-backend.exe
          test -f prebuilds/win32-arm64/ghostcrab-document.exe
          file prebuilds/win32-arm64/ghostcrab-backend.exe | grep -Ei 'PE32|PE32\+|Aarch64'

      - name: Upload prebuilds artifact
        uses: actions/upload-artifact@v4
        with:
          name: prebuilds
          path: prebuilds/
          retention-days: 1

  # ── Job 2: stage to npm with provenance (maintainer approves with 2FA) ──────
  publish:
    name: Stage to npm
    runs-on: ubuntu-latest
    needs: build-backends
    environment: npm-publish # configure trusted publishing in this environment

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # Staged publishing requires Node >= 22.14.0 and npm >= 11.15.0.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Upgrade npm for staged publishing
        run: |
          npm install -g npm@^11.15.0
          npm --version

      - name: Install dependencies
        run: npm ci --ignore-scripts --omit=optional

      - name: Build TypeScript
        run: npm run build

      - name: Download prebuilds
        uses: actions/download-artifact@v4
        with:
          name: prebuilds
          path: prebuilds/

      - name: List package contents (pre-publish audit)
        run: |
          npm pack --dry-run 2>&1 | head -60
          echo "---"
          find prebuilds -type f | sort

      - name: Verify binary is executable (Linux x64 spot-check)
        run: |
          chmod +x prebuilds/linux-x64/ghostcrab-backend
          file prebuilds/linux-x64/ghostcrab-backend

      - name: Stage to npm (platform packages + root — approval required to go live)
        run: node scripts/publish-npm-split.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── Job 3: Windows beta install smoke (catches npm.cmd EINVAL regressions) ───
  beta-install-windows:
    name: Beta install smoke (Windows)
    runs-on: windows-latest
    needs: build-backends

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Upgrade npm for multi-platform lockfile handling
        run: |
          npm install -g npm@^11.15.0
          npm --version

      - name: Install dependencies
        run: npm ci --ignore-scripts --omit=optional

      - name: Build TypeScript
        run: npm run build

      - name: Download prebuilds
        uses: actions/download-artifact@v4
        with:
          name: prebuilds
          path: prebuilds/

      - name: Pack local tarballs (reuse prebuilds)
        run: npm run pack:local:reuse-prebuilds

      - name: Build beta bundle
        run: node scripts/make-beta-bundle.mjs

      - name: Install from beta bundle
        shell: pwsh
        run: |
          Set-Location dist-pack/beta-bundle
          node install-beta.mjs

      - name: Smoke gcp --help
        shell: pwsh
        run: |
          node dist-pack/beta-bundle/node_modules/@mindflight/ghostcrab-personal-mcp/bin/gcp.mjs --help
