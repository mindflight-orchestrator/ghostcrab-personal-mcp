name: Write integrity

on:
  workflow_call:

permissions:
  contents: read

jobs:
  sqlite-and-mutations:
    runs-on: ubuntu-latest
    env:
      GHOSTCRAB_TEST_REQUIRE_SQLITE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Require SQLite and FTS5
        run: node -e 'const {DatabaseSync}=require("node:sqlite"); const db=new DatabaseSync(":memory:"); db.exec("CREATE VIRTUAL TABLE probe USING fts5(content)"); db.close();'
      - name: Build
        run: npm run build
      - name: Test coverage including unimported sources
        run: npm run test:coverage
      - name: Verify data invariants and injected failures
        run: npm run test:integrity
      - name: Verify mutation detection
        run: npm run test:mutation
      - name: Upload test effectiveness reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: write-integrity-reports
          path: |
            coverage/coverage-summary.json
            reports/mutation/
