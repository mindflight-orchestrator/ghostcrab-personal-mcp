# PostgreSQL Configuration File
# This file is copied to /etc/postgresql/postgresql.conf and referenced via config_file

# Connection Settings
listen_addresses = '*'
port = 5432
max_connections = 100

# Memory Settings
shared_buffers = 128MB
effective_cache_size = 4GB
maintenance_work_mem = 64MB
work_mem = 4MB

# WAL Settings
wal_buffers = 16MB
checkpoint_completion_target = 0.9

# Query Tuning
random_page_cost = 1.1
effective_io_concurrency = 200

# Logging
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_statement = 'all'
log_duration = on
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '

# Extensions
# pgvector, roaringbitmap, pg_facets, pg_dgraph are installed via Dockerfile
