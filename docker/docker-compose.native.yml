services:
  postgres:
    build:
      context: ..
      dockerfile: docker/Dockerfile.postgres
    container_name: ghostcrab_postgres_native
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ghostcrab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ghostcrab}
      POSTGRES_DB: ${POSTGRES_DB:-ghostcrab}
    volumes:
      - ghostcrab_postgres_native_data:/var/lib/postgresql/data
    ports:
      - "${PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ghostcrab} -d ${POSTGRES_DB:-ghostcrab}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ghostcrab_postgres_native_data:
    driver: local
